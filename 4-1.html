<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
            #box{
                width: 480px;
                padding: 30px;
                border:1px solid #ccc;
                font-size:12px;
                margin: 20px;

            }
            #box  h3{
                font-size: 10px;
                /* 居中 */
                text-align: center;
                /* 行高 */
                line-height: 33px;
                /* 字间距 */
                letter-spacing: 3px;
                color: #036;

            }
            #box p{
                line-height: 150%;
                color: #666;
                /* 首行缩进 */
                text-indent: 2cm;
            }
            #box a{
                color: #f11;
                text-decoration: none;
                font-weight: bold;
            }

            #box p span.no {
                color: blue;
                font-weight: bold;
            }
            #box p span.name {
                color: #333;
                font-weight: bold;
            }
            #box p span.hard {
                color: red;
                font-weight: bold;
            }
            #box p span.point {
                color: purple;
                border: 1px solid purple;
                padding: 0 2px;
            }
        
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="no">307</span>，姓名：<span class="name">单海晟</span>，班级：计算机24003班，对于《高级网页设计》课程的难度认知为：<span class="hard">难</span>，
            这个例子对应的知识点是：<span class="point">群组选择器、后代选择器、层叠与继承。</span>
            <a href="#">更多>></a>
        </p>
    </div>
    <!-- 额外内容 -->
    <!-- 学号：蓝色加粗，姓名：深色加粗，难度的值：红色加粗，知识点紫色边框 -->

</body>
</html>
