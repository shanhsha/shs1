<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单海晟的媒体查询布局</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            background: #f3f5fb;
            color: #252a40;
            font-family: "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(100%, 1000px);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 32px;
        }

        .description {
            margin: 0 0 28px;
            color: #6b7280;
            text-align: center;
        }

        .box-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .box-list li {
            min-height: 120px;
            display: grid;
            place-items: center;
            border: 1px solid rgb(255 255 255 / 70%);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgb(61 57 130 / 14%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        .box-list li:nth-child(1) {
            background: linear-gradient(135deg, #ef476f, #d62855);
        }

        .box-list li:nth-child(2) {
            background: linear-gradient(135deg, #f8961e, #e76f00);
        }

        .box-list li:nth-child(3) {
            background: linear-gradient(135deg, #ffd166, #e6a800);
        }

        .box-list li:nth-child(4) {
            background: linear-gradient(135deg, #06d6a0, #00a878);
        }

        .box-list li:nth-child(5) {
            background: linear-gradient(135deg, #118ab2, #087196);
        }

        .box-list li:nth-child(6) {
            background: linear-gradient(135deg, #4361ee, #3048c5);
        }

        .box-list li:nth-child(7) {
            background: linear-gradient(135deg, #8338ec, #6422c7);
        }

        .box-list li:nth-child(8) {
            background: linear-gradient(135deg, #f15bb5, #c83d92);
        }

        @media (max-width: 399px) {
            .box-list {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .box-list li {
                min-height: 100px;
            }
        }

        @media (min-width: 600px) and (max-width: 899px) {
            .box-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 18px;
            }
        }

        @media (min-width: 900px) {
            .box-list {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>单海晟的媒体查询布局</h1>
        <p class="description">调整视口宽度，观察每行盒子数量变化</p >
        <ul class="box-list">
            <li>盒子 1</li>
            <li>盒子 2</li>
            <li>盒子 3</li>
            <li>盒子 4</li>
            <li>盒子 5</li>
            <li>盒子 6</li>
            <li>盒子 7</li>
            <li>盒子 8</li>
        </ul>
    </main>
</body>
</html>
