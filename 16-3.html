建立时间：2026-10-29
使用的大模型：trae
功能名称：漫播"我的追剧"空状态页面 — 仿漫播 APP 紫色风格的登录引导页
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-3 漫播 · 我的追剧</title>
    <link rel="stylesheet" href="./font/font_5244753_5641vvib7co/iconfont.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 18%, rgba(180,150,220,0.55) 0%, rgba(180,150,220,0) 28%),
                radial-gradient(circle at 15% 10%, rgba(200,180,240,0.45) 0%, rgba(200,180,240,0) 22%),
                repeating-radial-gradient(
                    circle at 10px 10px,
                    rgba(255,255,255,0.055) 0px,
                    rgba(255,255,255,0.055) 1.5px,
                    transparent 1.5px,
                    transparent 20px
                ),
                linear-gradient(180deg, #3a1f5c 0%, #5d3a8a 45%, #8a65b8 100%);
            color: #fff;
        }

        /* ===== 顶部导航 ===== */
        .shs_topbar {
            background: linear-gradient(180deg, #2d1649 0%, #4a2a72 100%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            position: relative;
            z-index: 10;
        }
        .shs_topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 36px;
        }

        /* Logo */
        .shs_logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            flex-shrink: 0;
        }
        .shs-logo-fox {
            width: 36px; height: 36px;
            flex-shrink: 0;
        }
        .shs-logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffd9f5, #c49dff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 导航菜单 */
        .shs_nav {
            display: flex;
            gap: 6px;
            flex: 1;
            align-items: center;
        }
        .shs_nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 18px;
            height: 64px;
            font-size: 15px;
            color: rgba(255,255,255,0.82);
            text-decoration: none;
            position: relative;
            cursor: pointer;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .shs_nav-item:hover { color: #fff; }
        .shs_nav-item .iconfont { font-size: 15px; }
        .shs_nav-item.shs_active {
            color: #fff;
            font-weight: 700;
        }
        .shs_nav-item.shs_active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 18px;
            right: 18px;
            height: 3px;
            background: linear-gradient(90deg, #ff8ed4, #a488ff);
            border-radius: 3px 3px 0 0;
        }

        /* 右侧按钮组 */
        .shs_topbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        .shs-btn-login {
            padding: 7px 20px;
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 6px;
            background: transparent;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .shs-btn-login:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }
        .shs-btn-create {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #c46cff, #8b4fff);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(140,80,200,0.45);
            transition: filter 0.2s, transform 0.15s;
            display: flex; align-items: center; gap: 6px;
        }
        .shs-btn-create:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* ===== 主区 ===== */
        .shs_main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 30px 60px;
        }

        /* 大卡片 */
        .shs_card {
            background: linear-gradient(180deg, #f6f0fa 0%, #ece3f5 100%);
            border-radius: 18px;
            min-height: 620px;
            box-shadow: 0 18px 50px rgba(30,10,60,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
            overflow: hidden;
            position: relative;
        }

        /* 卡片顶部 tab 栏 */
        .shs_card-header {
            padding: 18px 36px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }
        .shs_card-title {
            font-size: 20px;
            font-weight: bold;
            color: #4a2a72;
            display: flex; align-items: center; gap: 8px;
        }
        .shs_card-title .iconfont { font-size: 22px; color: #c46cff; }

        /* 子 tab 菜单 */
        .shs_sub-tabs {
            display: flex;
            gap: 6px;
            margin: 14px 0 0;
            padding: 0 36px;
            flex-wrap: wrap;
        }
        .shs_sub-tab {
            padding: 8px 16px;
            font-size: 13px;
            color: #7a5fa0;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .shs_sub-tab:hover {
            color: #4a2a72;
            background: rgba(196,108,255,0.08);
        }
        .shs_sub-tab.shs_sub_active {
            color: #fff;
            background: linear-gradient(135deg, #c46cff, #8b4fff);
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(140,80,200,0.35);
        }

        /* 分隔线 */
        .shs_divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(140,100,180,0.35) 30%, rgba(140,100,180,0.35) 70%, transparent);
            margin: 0 36px;
        }

        /* 排序下拉 */
        .shs_sort-row {
            display: flex;
            justify-content: flex-end;
            padding: 10px 36px 0;
        }
        .shs_sort-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(140,100,180,0.2);
            border-radius: 18px;
            color: #6a4a8c;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .shs_sort-btn:hover { background: rgba(255,255,255,0.85); }
        .shs_sort-btn .iconfont { font-size: 11px; }

        /* ===== 空状态 ===== */
        .shs_empty {
            padding: 80px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .shs-fox-wrap {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 10px 24px rgba(140,80,200,0.25));
            animation: shs_float 3.5s ease-in-out infinite;
        }
        @keyframes shs_float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        .shs_empty-text {
            font-size: 15px;
            color: #7a5fa0;
            letter-spacing: 2px;
        }
        .shs_empty-btn {
            margin-top: 6px;
            padding: 10px 36px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #ff8ed4, #a488ff);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(160,100,220,0.4);
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .shs_empty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(160,100,220,0.55);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 880px) {
            .shs_topbar-inner { gap: 18px; padding: 0 18px; }
            .shs_nav-item { padding: 0 10px; font-size: 13px; }
            .shs-logo-text { font-size: 18px; letter-spacing: 2px; }
            .shs_main { padding: 18px; }
            .shs_card-header, .shs_sub-tabs, .shs_sort-row { padding-left: 20px; padding-right: 20px; }
            .shs_divider { margin: 0 20px; }
        }
        @media (max-width: 620px) {
            .shs_nav { display: none; }  /* 移动端隐藏顶部导航，保留 logo + 按钮 */
            .shs_btn-create { display: none; }
            .shs-fox-wrap { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="shs_topbar">
    <div class="shs_topbar-inner">
        <!-- Logo -->
        <a class="shs_logo" href="#">
            <!-- 狐狸 SVG 头像 -->
            <svg class="shs-logo-fox" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- 左耳 -->
                <path d="M18,34 L26,8 L40,28 Z" fill="#c46cff"/>
                <path d="M22,30 L27,14 L35,27 Z" fill="#ffd1f0"/>
                <!-- 右耳 -->
                <path d="M82,34 L74,8 L60,28 Z" fill="#c46cff"/>
                <path d="M78,30 L73,14 L65,27 Z" fill="#ffd1f0"/>
                <!-- 脸 -->
                <ellipse cx="50" cy="54" rx="32" ry="30" fill="#e6c1ff"/>
                <ellipse cx="50" cy="58" rx="22" ry="20" fill="#fff0fa"/>
                <!-- 眼睛 -->
                <ellipse cx="38" cy="48" rx="4" ry="5" fill="#2a1340"/>
                <ellipse cx="62" cy="48" rx="4" ry="5" fill="#2a1340"/>
                <circle cx="39" cy="46" r="1.3" fill="#fff"/>
                <circle cx="63" cy="46" r="1.3" fill="#fff"/>
                <!-- 鼻子 -->
                <ellipse cx="50" cy="60" rx="2.5" ry="2" fill="#2a1340"/>
                <!-- 嘴 -->
                <path d="M50,62 Q46,68 42,66" fill="none" stroke="#2a1340" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M50,62 Q54,68 58,66" fill="none" stroke="#2a1340" stroke-width="1.4" stroke-linecap="round"/>
                <!-- 腮红 -->
                <ellipse cx="30" cy="62" rx="4" ry="2.5" fill="#ffb3d9" opacity="0.7"/>
                <ellipse cx="70" cy="62" rx="4" ry="2.5" fill="#ffb3d9" opacity="0.7"/>
            </svg>
            <span class="shs-logo-text">漫播</span>
        </a>

        <!-- 导航菜单 -->
        <nav class="shs_nav">
            <a class="shs_nav-item" href="#">
                <i class="iconfont icon-pingguo"></i> 下载APP
            </a>
            <a class="shs_nav-item" href="#">
                <i class="iconfont icon-shouye3"></i> 开通会员
            </a>
            <a class="shs_nav-item" href="#">
                <i class="iconfont icon-shangcheng"></i> 充值中心
            </a>
            <a class="shs_nav-item shs_active" href="#">
                <i class="iconfont icon-shoucang"></i> 我的追剧
            </a>
        </nav>

        <!-- 右侧按钮 -->
        <div class="shs_topbar-right">
            <button class="shs-btn-login" onclick="alert('请先登录再查看追剧记录哦～')">
                <i class="iconfont icon-denglu"></i> 登录
            </button>
            <button class="shs-btn-create">
                <i class="iconfont icon-zengjia"></i> 创作中心/投稿
            </button>
        </div>
    </div>
</header>

<!-- ===== 主体 ===== -->
<main class="shs_main">
    <section class="shs_card">
        <!-- 卡片标题 + tab -->
        <div class="shs_card-header">
            <h2 class="shs_card-title">
                <i class="iconfont icon-wode1"></i> 我的追剧
            </h2>
        </div>

        <div class="shs_sub-tabs" id="shs_subTabs">
            <div class="shs_sub-tab" data-tab="listen">
                <i class="iconfont icon-shipin"></i> 收听漫播精品剧
            </div>
            <div class="shs_sub-tab" data-tab="comment">
                <i class="iconfont icon-pinglun"></i> 发表评论&amp;弹幕
            </div>
            <div class="shs_sub-tab shs_sub_active" data-tab="collect">
                <i class="iconfont icon-shoucang"></i> 收藏剧集及时追
            </div>
            <div class="shs_sub-tab" data-tab="sync">
                <i class="iconfont icon-faxian"></i> 多端同步播放记录
            </div>
        </div>

        <div class="shs_divider"></div>

        <!-- 排序下拉 -->
        <div class="shs_sort-row">
            <button class="shs_sort-btn">
                按收藏时间 <i class="iconfont icon-gengduo"></i>
            </button>
        </div>

        <!-- 空状态 -->
        <div class="shs_empty">
            <!-- 小狐狸 SVG -->
            <div class="shs-fox-wrap">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- 身体 -->
                    <ellipse cx="100" cy="132" rx="48" ry="42" fill="#e6c1ff"/>
                    <ellipse cx="100" cy="140" rx="34" ry="28" fill="#fff0fa"/>

                    <!-- 左耳 -->
                    <path d="M58,90 L72,42 L88,80 Z" fill="#c46cff"/>
                    <path d="M66,82 L73,54 L82,78 Z" fill="#ffd1f0"/>
                    <!-- 右耳 -->
                    <path d="M142,90 L128,42 L112,80 Z" fill="#c46cff"/>
                    <path d="M134,82 L127,54 L118,78 Z" fill="#ffd1f0"/>

                    <!-- 脸部 -->
                    <ellipse cx="100" cy="100" rx="38" ry="34" fill="#e6c1ff"/>
                    <ellipse cx="100" cy="104" rx="26" ry="22" fill="#fff0fa"/>

                    <!-- 眼睛（眯眼可爱） -->
                    <path d="M82,96 Q86,92 90,96" fill="none" stroke="#2a1340" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M110,96 Q114,92 118,96" fill="none" stroke="#2a1340" stroke-width="2.5" stroke-linecap="round"/>

                    <!-- 鼻子 -->
                    <ellipse cx="100" cy="110" rx="3" ry="2.2" fill="#2a1340"/>

                    <!-- 腮红 -->
                    <ellipse cx="74" cy="108" rx="5" ry="3" fill="#ffb3d9" opacity="0.8"/>
                    <ellipse cx="126" cy="108" rx="5" ry="3" fill="#ffb3d9" opacity="0.8"/>

                    <!-- 尾巴（右边翘起来） -->
                    <path d="M142,140 Q175,118 165,86 Q158,95 152,110 Q158,128 146,142 Z" fill="#c46cff"/>
                    <path d="M160,112 Q168,100 165,90" fill="none" stroke="#ffd1f0" stroke-width="4" stroke-linecap="round"/>

                    <!-- 手机（抱在胸前） -->
                    <rect x="88" y="148" width="24" height="34" rx="4" fill="#2a1340"/>
                    <rect x="91" y="152" width="18" height="22" rx="1" fill="#8b4fff"/>
                    <rect x="94" y="155" width="12" height="2" fill="#fff" opacity="0.6"/>
                    <rect x="94" y="159" width="9" height="2" fill="#fff" opacity="0.4"/>
                    <circle cx="100" cy="172" r="1.5" fill="#fff" opacity="0.7"/>

                    <!-- 小手（抱着手机） -->
                    <ellipse cx="78" cy="150" rx="10" ry="7" fill="#e6c1ff"/>
                    <ellipse cx="122" cy="150" rx="10" ry="7" fill="#e6c1ff"/>
                </svg>
            </div>
            <p class="shs_empty-text">请登录后查看</p>
            <button class="shs_empty-btn" onclick="alert('正在前往登录页…')">
                <i class="iconfont icon-denglu"></i> 立即登录
            </button>
        </div>
    </section>
</main>

<script>
    // 子 tab 切换
    var tabs = document.querySelectorAll(".shs_sub-tab");
    tabs.forEach(function(t) {
        t.addEventListener("click", function() {
            tabs.forEach(function(x) { x.classList.remove("shs_sub_active"); });
            t.classList.add("shs_sub_active");
        });
    });
</script>
</body>
</html>
