<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Animation 幻灯片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .slider-box {
      width: 620px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .title {
      text-align: center;
      font-size: 28px;
      line-height: 80px;
      color: #333;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff9a9e, #fad0c4, #a18cd1);
      color: #fff;
      font-weight: bold;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 460px;
      overflow: hidden;
      background: #fafafa;
    }

    .slide {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      opacity: 0;
      animation: fade 9s ease-in-out infinite;
    }

    .slide:nth-child(1) {
      animation-delay: 0s;
    }

    .slide:nth-child(2) {
      animation-delay: 3s;
    }

    .slide:nth-child(3) {
      animation-delay: 6s;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .slide p {
      position: absolute;
      left: 30px;
      bottom: 30px;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      background: transparent;
      z-index: 1;
    }

    @keyframes fade {
      0%, 20% {
        opacity: 1;
      }
      30%, 90% {
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="slider-box">
    <div class="title">单海晟</div>
    <div class="slider">
      <div class="slide">
        <img src="./img/1.jpg" alt="图片1" />
        <p>单海晟 · 作品一</p>
      </div>
      <div class="slide">
        <img src="./img/2.jpg" alt="图片2" />
        <p>单海晟 · 作品二</p>
      </div>
      <div class="slide">
        <img src="./img/3.jpg" alt="图片3" />
        <p>单海晟 · 作品三</p>
      </div>
    </div>
  </div>
</body>
</html>
