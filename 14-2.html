<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-2 JavaScript 基本数据类型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #333;
        }

        .shs_container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .shs_header {
            text-align: center;
            color: #fff;
            margin-bottom: 35px;
        }
        .shs_header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .shs_header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .shs_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .shs_card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border-top: 4px solid #667eea;
        }
        .shs_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        }

        .shs_card h2 {
            font-size: 20px;
            color: #4a4a4a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shs_type-badge {
            display: inline-block;
            background: #667eea;
            color: #fff;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .shs_desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .shs_code {
            background: #2d2d2d;
            color: #f8f8f2;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .shs_result {
            background: #f5f7fa;
            border-left: 3px solid #667eea;
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 0 6px 6px 0;
        }
        .shs_result-label {
            color: #667eea;
            font-weight: bold;
            margin-right: 6px;
        }
        .shs_result-value {
            color: #333;
            font-family: "Consolas", monospace;
        }

        .shs_null-note {
            margin-top: 25px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 14px;
            color: #856404;
        }
        .shs_null-note strong {
            color: #856404;
        }

        .shs_footer {
            text-align: center;
            color: rgba(255,255,255,0.75);
            margin-top: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="shs_container">
        <div class="shs_header">
            <h1>JavaScript 六种基本数据类型</h1>
            <p>Primitive Data Types — 单海晟</p>
        </div>

        <div class="shs_grid" id="shs_grid">
            <!-- 卡片由 JS 动态生成 -->
        </div>

        <div class="shs_null-note">
            <strong>⚠️ 注意：</strong>
            <code>null</code> 的 <code>typeof</code> 返回 <code>"object"</code>，这是 JavaScript 自诞生以来就存在的历史遗留 Bug。
            实际开发中判断 <code>null</code> 请使用 <code>value === null</code>。
        </div>

        <div class="shs_footer">
            ECMAScript 标准定义的 6 种原始类型（Primitive Types）
        </div>
    </div>

    <script>
        // 六种基本数据类型演示数据
        var shs_types = [
            {
                name: "String 字符串",
                badge: "string",
                desc: "用单引号、双引号或反引号包裹的文本。",
                code:  'var shs_name = "单海晟";\nvar shs_slogan = \'Hello JS\';\nvar shs_template = `我是 ${shs_name}`;',
                eval: function () {
                    var shs_name = "单海晟";
                    var shs_slogan = 'Hello JS';
                    var shs_template = "我是 " + shs_name;
                    return [
                        { k: 'typeof shs_name', v: typeof shs_name },
                        { k: 'shs_name', v: shs_name },
                        { k: 'shs_slogan', v: shs_slogan },
                        { k: 'shs_template', v: shs_template }
                    ];
                }
            },
            {
                name: "Number 数字",
                badge: "number",
                desc: "包括整数、浮点数、特殊值 Infinity 和 NaN。",
                code:  'var shs_int = 42;\nvar shs_float = 3.14;\nvar shs_nan = NaN;\nvar shs_inf = Infinity;',
                eval: function () {
                    var shs_int = 42;
                    var shs_float = 3.14;
                    var shs_nan = NaN;
                    var shs_inf = Infinity;
                    return [
                        { k: 'typeof shs_int',   v: typeof shs_int },
                        { k: 'shs_float',        v: shs_float },
                        { k: 'isNaN(shs_nan)',   v: isNaN(shs_nan) },
                        { k: 'shs_inf',          v: shs_inf }
                    ];
                }
            },
            {
                name: "Boolean 布尔",
                badge: "boolean",
                desc: "只有两个取值：true 和 false，常用于条件判断。",
                code:  'var shs_ok = true;\nvar shs_no = false;\nvar shs_cmp = 10 > 3;',
                eval: function () {
                    var shs_ok = true;
                    var shs_no = false;
                    var shs_cmp = 10 > 3;
                    return [
                        { k: 'typeof shs_ok',   v: typeof shs_ok },
                        { k: 'shs_ok',          v: shs_ok },
                        { k: 'shs_no',          v: shs_no },
                        { k: '10 > 3',          v: shs_cmp }
                    ];
                }
            },
            {
                name: "Undefined 未定义",
                badge: "undefined",
                desc: "变量声明后未赋值时的默认值，也可显式赋值。",
                code:  'var shs_x;\nvar shs_y = undefined;\n// 访问不存在的属性也返回 undefined',
                eval: function () {
                    var shs_x;
                    var shs_y = undefined;
                    var shs_obj = {};
                    return [
                        { k: 'typeof shs_x',       v: typeof shs_x },
                        { k: 'shs_x === shs_y',    v: shs_x === shs_y },
                        { k: 'shs_obj.foo',        v: shs_obj.foo }
                    ];
                }
            },
            {
                name: "Null 空值",
                badge: "null",
                desc: "表示空对象引用，通常用于显式清空变量。",
                code:  'var shs_empty = null;\n// typeof null 返回 "object"（历史Bug）',
                eval: function () {
                    var shs_empty = null;
                    return [
                        { k: 'typeof shs_empty',   v: typeof shs_empty + '  ← 历史Bug!' },
                        { k: 'shs_empty === null', v: shs_empty === null },
                        { k: 'shs_empty == undefined', v: shs_empty == undefined }
                    ];
                }
            },
            {
                name: "Symbol 符号",
                badge: "symbol",
                desc: "ES6 新增，创建唯一标识符，常用于对象私有属性键。",
                code:  'var shs_sym1 = Symbol("id");\nvar shs_sym2 = Symbol("id");\n// 相同描述的 Symbol 也不相等',
                eval: function () {
                    var shs_sym1 = Symbol("id");
                    var shs_sym2 = Symbol("id");
                    return [
                        { k: 'typeof shs_sym1',    v: typeof shs_sym1 },
                        { k: 'shs_sym1.toString()',v: shs_sym1.toString() },
                        { k: 'shs_sym1 === shs_sym2', v: shs_sym1 === shs_sym2 }
                    ];
                }
            }
        ];

        // 动态渲染卡片
        var shs_grid = document.getElementById("shs_grid");
        for (var i = 0; i < shs_types.length; i++) {
            var shs_t = shs_types[i];
            var shs_results = shs_t.eval();

            // 构建结果行 HTML
            var shs_resultHtml = "";
            for (var j = 0; j < shs_results.length; j++) {
                shs_resultHtml += '<div><span class="shs_result-label">'
                    + shs_results[j].k
                    + '</span><span class="shs_result-value">'
                    + shs_results[j].v
                    + '</span></div>';
            }

            var shs_cardHtml =
                '<div class="shs_card">' +
                    '<h2>' + shs_t.name + ' <span class="shs_type-badge">' + shs_t.badge + '</span></h2>' +
                    '<div class="shs_desc">' + shs_t.desc + '</div>' +
                    '<pre class="shs_code">' + shs_t.code + '</pre>' +
                    '<div class="shs_result">' + shs_resultHtml + '</div>' +
                '</div>';

            shs_grid.innerHTML += shs_cardHtml;
        }
    </script>
</body>
</html>
