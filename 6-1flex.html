<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>307 单海晟</title>
    <style>
        .flex{
            /* 容器 */
            display: flex;
            /* 子元素一行显示 */
            flex-wrap: wrap;
        }
        .flex li{
            /* float: left; */
            border: 1px solid #333;
            width: 49%;
            line-height: 100px;
            list-style: none;
            text-align: center;
            flex-grow: 1;
            display: flex;
        }
        .flex li:nth-child(1){
            align-items: center; 
            /* 水平居中 */
            justify-content: center;

        }
        .box{
            width: 50%;
            height: 50%;
            background-color: #f1f2f3;
        }
        .flex li:nth-child(1).box{
            background-color: #3333;

        }
        /* ===== 原有：第一个 li 内两个方块上下排列 ===== */
        .flex li:nth-child(1) {
            width: 100%;
            height: 400px;
            flex-direction: column;    /* 上下排列 */
            gap: 20px;                 /* 方块之间的间距 */
            background-color: transparent;
        }
        .flex li:nth-child(1) .box {
            width: 150px;              /* 方块宽度 */
            height: 100px;             /* 方块高度 */
            background-color: transparent;
            border: 1px solid #333;    /* 方块边框 */
        }

        /* ===== 原有：图二图形 ===== */
        .inner-box {
            width: 200px;
            height: 150px;
            background-color: transparent;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inner-box .small-box {
            width: 60px;
            height: 80px;
            background-color: transparent;
            border: 1px solid #333;
        }

        /* ===== 新增：左边图案（2×2 网格） ===== */
        .left-pattern {
            width: 100%;
            height: 400px;
            border: 1px solid #333;
            background-color: transparent;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .left-pattern .cell {
            width: 45%;
            height: 40%;
            border: 1px solid #333;
            background-color: transparent;
        }

        /* ===== 新增：右边图案（上方1大块 + 下方2块并排） ===== */
        .right-pattern {
            width: 100%;
            height: 400px;
            border: 1px solid #333;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
        }
        .right-pattern .top-cell {
            width: 100%;
            height: 40%;
            border: 1px solid #333;
            background-color: transparent;
        }
        .right-pattern .bottom-row {
            display: flex;
            flex: 1;
            gap: 15px;
        }
        .right-pattern .bottom-row .cell {
            flex: 1;
            border: 1px solid #333;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <h2>单海晟</h2>
    <ul class="flex">
        <!-- ========== 原有代码：完全保留，不动 ========== -->
        <li>
            <div class="inner-box">
                <div class="small-box"></div>
            </div>
            <div class="box"></div>
            <div class="box"></div>
        </li>

        <!-- ========== 新增：左边图案（2×2 网格） ========== -->
        <li>
            <div class="left-pattern">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </li>

        <!-- ========== 新增：右边图案（上方1大块 + 下方2块） ========== -->
        <li>
            <div class="right-pattern">
                <div class="top-cell"></div>
                <div class="bottom-row">
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>
            </div>
        </li>

        <!-- ========== 原有列表项：完全保留，不动 ========== -->
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
</body>
</html>
