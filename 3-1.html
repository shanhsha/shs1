<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>307 单海晟</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action="http://huanqiu.com"name="shs">
        <p>
            用户名：<input type="text"name="username">
        </p>
        <p>
            密码：<input type="password"name="password">
        </p>
        <p>
            性别<input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <!--保密-->
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="1">吃饭
            <input type="checkbox" name="hobby" value="2">睡觉
            <input type="checkbox" name="hobby" value="3">打豆豆
        </p>
        <!-- 籍贯 -->
        <p>
            籍贯:<select name = "jiguan">
                <option value="1"selected>沈阳</option>
                <option value="2">上海</option>
                <option value="3">北京</option>
                <option value="4">天津</option>
                </select>
        </p>
        <!-- 个人简介 textarea -->
        <p>
            个人简介：<textarea name="jianjie" cols="30" row="5"></textarea>
        </p>
        <!-- 出生日期 -->
         <p>
            出生日期：<input type="date" name="birthday">
         </p>
         <!-- 多文件上传 -->
         <p>
            <input type="file" name="files" multiple>
         </p>
         <!-- 按钮 -->
          <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
          </p>
          </form>
            <!-- 按钮button -->
            <button>表单外的按钮</button>

    </form>


</body>
</html>
