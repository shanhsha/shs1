<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        background-color: #ccc;
        display: flex;
        flex-wrap: wrap;
        margin: 10px;
    }
    .box{
        width: 150px;
        height: 150px;
        border: 1px solid #ccc;
        margin: 10px;
        background-color: #fff;
        font-size: 14px;
        display: flex;
        /* 水平居中 */
        justify-content: center;    
        /* 垂直居中 */
        align-items: center;
        transition: all 0.6s;
        box-sizing: border-box;
        /* width包括padding和border */
    }
    .box:first-child:hover{
        background-color: #9113d5;
        color: #fff;
        font-size: 100px;
        border-width: 30px;
    }
    .box:nth-child(2):hover{
        box-shadow: 10px 10px 20px rgba(0,0,0,0.5);

    }
    .box:nth-child(3):hover{
        text-shadow: 100px 0px 20px rgba(0,0,0,0.5);
    }
    .box:nth-of-type(4):hover{
        border-radius: 50%;
    }
    .box:nth-of-type(5){
        /* 线性渐变 */
        background: linear-gradient(45deg, #1db525, #635b9b);
    }
    .box:nth-of-type(6){
        /* 镜像渐变 */

        background: radial-gradient(#69986c,#a491ae);
    }
    .box:nth-of-type(6)+:hover{
        transform: scale(0.5);

    }
    .box:nth-of-type(8):hover{
        transform: translateX(100px);
    }
    .box:nth-of-type(9):hover{
        transform: rotateX(-180deg);
    }
    .box:nth-of-type(10):hover{
        transform: skewX(-45deg);
    }
    .box:nth-last-child(2):hover::before{
        content:"#";
        color: red;
    }
    .box:nth-last-child(1):hover::after{
        content:"单海晟";
        color: red;
        font-size: 6px;
        display: block;
        width: 40px;
        height: 10px;
        /* 黑底白字居中圆角你的名字，有距离 */
        border-radius: 5px;
        background-color: #000;
        color: #fff;
        text-align: center;
        line-height: 10px;
    }
    .box:nth-child(3n):hover{
        border: 3px solid rgb(51, 167, 43);
    }
    /* 拓展鼠标在偶数上时有变化，变化效果自定义 */
    .box:nth-child(2n):hover{
        transform: scale(1.2);
        box-shadow: 0 0 10px rgba(216, 10, 10, 0.5);

    }

</style>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>

    </div>
</body>
</html>
