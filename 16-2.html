<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-2 JavaScript 对象</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f12711 0%, #f5af19 50%, #00c6ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 30px 20px 60px;
        }

        .shs_container {
            max-width: 1080px;
            margin: 0 auto;
        }

        /* 头部 */
        .shs_header {
            text-align: center;
            color: #fff;
            margin-bottom: 28px;
        }
        .shs_header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.25);
            letter-spacing: 2px;
        }
        .shs_header p {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.8;
        }

        /* 通用面板 */
        .shs_panel {
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            padding: 22px 26px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.18);
            margin-bottom: 22px;
        }
        .shs_panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shs_panel-title::before {
            content: "";
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #f12711, #00c6ff);
            border-radius: 2px;
        }

        /* 对象舞台 */
        .shs_stage-wrap {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .shs_stage {
            flex: 1 1 420px;
            background: linear-gradient(180deg, #fff9f0, #fff3e0);
            border: 2px dashed #e0a96d;
            border-radius: 14px;
            padding: 18px;
            min-height: 200px;
            position: relative;
        }
        .shs_stage::before {
            content: "const person = {";
            position: absolute;
            top: -14px;
            left: 18px;
            background: #f5af19;
            color: #fff;
            font-family: "Consolas", monospace;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
        }
        .shs_stage::after {
            content: "}";
            position: absolute;
            bottom: -12px;
            left: 18px;
            background: #f5af19;
            color: #fff;
            font-family: "Consolas", monospace;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .shs_prop {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin: 6px 0;
            border-radius: 10px;
            background: #fff;
            border-left: 4px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: transform 0.35s cubic-bezier(.34,1.56,.64,1),
                        box-shadow 0.25s,
                        border-color 0.25s;
            animation: shs_slideIn 0.35s ease;
        }
        @keyframes shs_slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .shs_prop.shs_del {
            animation: shs_fadeLeft 0.4s ease forwards;
        }
        @keyframes shs_fadeLeft {
            to { opacity: 0; transform: translateX(40px); }
        }
        .shs_prop.shs_highlight {
            box-shadow: 0 0 0 3px rgba(255,215,0,0.7), 0 6px 14px rgba(0,0,0,0.2);
            transform: scale(1.04);
        }

        .shs_key {
            font-family: "Consolas", monospace;
            font-weight: bold;
            color: #0066cc;
            background: #e8f4ff;
            padding: 4px 10px;
            border-radius: 6px;
            min-width: 80px;
            text-align: center;
            font-size: 14px;
        }
        .shs_colon { color: #888; font-weight: bold; }
        .shs_val {
            flex: 1;
            font-family: "Consolas", monospace;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-all;
        }

        /* 按值类型染色 */
        .shs_t_str    { background: #fff0f0; color: #c0392b; border-color: #e74c3c; }
        .shs_t_number { background: #e8f4fd; color: #2980b9; border-color: #3498db; }
        .shs_t_bool   { background: #eaffea; color: #27ae60; border-color: #2ecc71; }
        .shs_t_null   { background: #f0f0f0; color: #7f8c8d; border-color: #95a5a6; }
        .shs_t_obj    { background: #f5eef8; color: #8e44ad; border-color: #9b59b6; }
        .shs_t_arr    { background: #fef9e7; color: #d68910; border-color: #f39c12; }
        .shs_t_func   { background: #e8f8f5; color: #117a65; border-color: #1abc9c; }

        /* 代码显示 */
        .shs_code {
            flex: 0 0 290px;
            background: #1e1e3a;
            border-radius: 14px;
            padding: 18px 20px;
            color: #d4d4ff;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.7;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .shs_code .shs_comment { color: #6a9955; }
        .shs_code .shs_kw { color: #c586c0; }
        .shs_code .shs_str { color: #ce9178; }
        .shs_code .shs_num { color: #b5cea8; }
        .shs_code .shs_func { color: #dcdcaa; }
        .shs_code .shs_result {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,0.15);
            color: #4ec9b0;
        }

        /* 方法分组 */
        .shs_group { margin-bottom: 18px; }
        .shs_group-title {
            font-size: 14px;
            font-weight: bold;
            color: #c0392b;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #fde8d8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shs_group-title .shs_badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #fff0e0;
            color: #c0392b;
            font-weight: normal;
        }
        .shs_group-title .shs_badge.shs_safe { background: #e4fff1; color: #2a9d6c; }

        .shs_btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .shs_btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        .shs_btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            filter: brightness(1.08);
        }
        .shs_btn:active { transform: translateY(0); }
        .shs_btn .shs_small {
            display: block;
            font-size: 11px;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* 按钮配色 */
        .shs_btn.shs_add      { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .shs_btn.shs_update   { background: linear-gradient(135deg, #f7971e, #ffd200); color:#333;}
        .shs_btn.shs_del      { background: linear-gradient(135deg, #ee0979, #ff6a00); }
        .shs_btn.shs_dot      { background: linear-gradient(135deg, #667eea, #764ba2); }
        .shs_btn.shs_bracket  { background: linear-gradient(135deg, #4facfe, #00f2fe); color:#333;}

        .shs_btn.shs_keys     { background: linear-gradient(135deg, #f12711, #f5af19); }
        .shs_btn.shs_values   { background: linear-gradient(135deg, #fc4a1a, #f7b733); }
        .shs_btn.shs_entries  { background: linear-gradient(135deg, #ee5a6f, #c0392b); }
        .shs_btn.shs_assign   { background: linear-gradient(135deg, #a18cd1, #fbc2eb); color:#333;}
        .shs_btn.shs_spread   { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .shs_btn.shs_has      { background: linear-gradient(135deg, #56ab2f, #a8e063); color:#333;}

        .shs_btn.shs_stringify{ background: linear-gradient(135deg, #eb3349, #f45c43); }
        .shs_btn.shs_method   { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        .shs_btn.shs_reset    { background: #6c757d; }

        /* 日志 */
        .shs_log {
            background: #fff;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
            color: #444;
            line-height: 1.8;
        }
        .shs_log::-webkit-scrollbar { width: 8px; }
        .shs_log::-webkit-scrollbar-thumb {
            background: linear-gradient(#f12711, #00c6ff);
            border-radius: 4px;
        }
        .shs_log-title { font-size: 13px; color: #888; margin-bottom: 6px; }
        .shs_log-item { padding: 4px 0; border-bottom: 1px dashed #eee; }
        .shs_log-item:last-child { border-bottom: none; }
        .shs_log-item .shs_tag {
            display: inline-block;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            background: #fff0e0;
            color: #c0392b;
            margin-right: 6px;
        }

        /* 类型图例 */
        .shs_legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-size: 12px;
            color: #555;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #eee;
        }
        .shs_legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .shs_legend-dot {
            width: 12px; height: 12px;
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .shs_header h1 { font-size: 24px; }
            .shs_code { flex: 1 1 100%; }
            .shs_stage-wrap { flex-direction: column; }
            .shs_key { min-width: 60px; font-size: 13px; }
            .shs_btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="shs_container">
        <div class="shs_header">
            <h1>🧩 JavaScript 对象可视化</h1>
            <p>键值对卡片 + 类型染色 — 加属性、改值、删键、查方法，所有变化都看得见！</p>
        </div>

        <!-- 对象舞台 + 代码 -->
        <div class="shs_panel">
            <div class="shs_panel-title">🎭 对象舞台</div>
            <div class="shs_stage-wrap">
                <div>
                    <div class="shs_stage" id="shs_stage">
                        <!-- 属性由 JS 渲染 -->
                    </div>
                    <div class="shs_legend">
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#e74c3c"></span>String</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#3498db"></span>Number</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#2ecc71"></span>Boolean</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#95a5a6"></span>null</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#9b59b6"></span>Object</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#f39c12"></span>Array</div>
                        <div class="shs_legend-item"><span class="shs_legend-dot" style="background:#1abc9c"></span>Function</div>
                    </div>
                </div>
                <div class="shs_code" id="shs_code">
<span class="shs_comment">// 点击按钮试试看</span>
<span class="shs_kw">const</span> person = {
  name: <span class="shs_str">"小明"</span>,
  age:  <span class="shs_num">18</span>,
  isStudent: <span style="color:#2ecc71">true</span>
};
                </div>
            </div>
        </div>

        <!-- 属性访问 -->
        <div class="shs_panel">
            <div class="shs_panel-title">🔑 属性访问（读取）</div>
            <div class="shs_group">
                <div class="shs_group-title">读取 / 查找属性 <span class="shs_badge shs_safe">不修改</span></div>
                <div class="shs_btns">
                    <button class="shs_btn shs_dot"     onclick="shs_do('dot')">person.name<span class="shs_small">点号访问</span></button>
                    <button class="shs_btn shs_bracket" onclick="shs_do('bracket')">person["age"]<span class="shs_small">方括号访问</span></button>
                    <button class="shs_btn shs_has"     onclick="shs_do('hasName')">"name" in person<span class="shs_small">属性是否存在</span></button>
                    <button class="shs_btn shs_has"     onclick="shs_do('hasPhone')">hasOwnProperty("phone")<span class="shs_small">是否有phone</span></button>
                </div>
            </div>
        </div>

        <!-- 增删改 -->
        <div class="shs_panel">
            <div class="shs_panel-title">✏️ 增删改属性</div>
            <div class="shs_group">
                <div class="shs_group-title">修改原对象 <span class="shs_badge">对象会变</span></div>
                <div class="shs_btns">
                    <button class="shs_btn shs_add"    onclick="shs_do('addEmail')">加 email<span class="shs_small">person.email = "..."</span></button>
                    <button class="shs_btn shs_add"    onclick="shs_do('addScore')">加 score<span class="shs_small">person.score = 95</span></button>
                    <button class="shs_btn shs_update" onclick="shs_do('updAge')">改 age = 19<span class="shs_small">person.age = 19</span></button>
                    <button class="shs_btn shs_del"    onclick="shs_do('delPhone')">删 phone<span class="shs_small">delete person.phone</span></button>
                    <button class="shs_btn shs_reset"  onclick="shs_do('reset')">🔄 重置<span class="shs_small">回到初始状态</span></button>
                </div>
            </div>
        </div>

        <!-- Object 静态方法 -->
        <div class="shs_panel">
            <div class="shs_panel-title">📚 Object 内置方法</div>
            <div class="shs_group">
                <div class="shs_group-title">不修改原对象 <span class="shs_badge shs_safe">返回新值</span></div>
                <div class="shs_btns">
                    <button class="shs_btn shs_keys"      onclick="shs_do('keys')">Object.keys(person)<span class="shs_small">所有键 → 数组</span></button>
                    <button class="shs_btn shs_values"    onclick="shs_do('values')">Object.values(person)<span class="shs_small">所有值 → 数组</span></button>
                    <button class="shs_btn shs_entries"   onclick="shs_do('entries')">Object.entries(person)<span class="shs_small">[键,值] 二维数组</span></button>
                    <button class="shs_btn shs_assign"    onclick="shs_do('assign')">Object.assign({}, extra)<span class="shs_small">拷贝合并</span></button>
                    <button class="shs_btn shs_spread"    onclick="shs_do('spread')">const copy = {...person}<span class="shs_small">展开运算符浅拷贝</span></button>
                    <button class="shs_btn shs_stringify" onclick="shs_do('stringify')">JSON.stringify(person)<span class="shs_small">转 JSON 字符串</span></button>
                </div>
            </div>
        </div>

        <!-- 方法 & this -->
        <div class="shs_panel">
            <div class="shs_panel-title">🎯 对象方法（this 指向）</div>
            <div class="shs_group">
                <div class="shs_group-title">给对象加上函数属性 <span class="shs_badge">对象会变</span></div>
                <div class="shs_btns">
                    <button class="shs_btn shs_method" onclick="shs_do('addMethod')">加 sayHi()<span class="shs_small">person.sayHi = function(){...}</span></button>
                    <button class="shs_btn shs_method" onclick="shs_do('callMethod')">调用 person.sayHi()<span class="shs_small">会触发 alert</span></button>
                </div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="shs_panel">
            <div class="shs_panel-title">📝 操作日志</div>
            <div class="shs_log" id="shs_log"></div>
        </div>
    </div>

    <script>
        // ===== 初始对象 =====
        var shs_INITIAL = {
            name: "小明",
            age: 18,
            isStudent: true,
            phone: null,
            hobbies: ["篮球", "编程", "吉他"],
            address: { city: "北京", district: "海淀" }
        };
        var shs_obj = JSON.parse(JSON.stringify(shs_INITIAL)); // 深拷贝当前对象

        // ===== 值类型判定 → 样式类 =====
        function shs_typeClass(val) {
            if (val === null) return "shs_t_null";
            if (Array.isArray(val)) return "shs_t_arr";
            var t = typeof val;
            if (t === "string") return "shs_t_str";
            if (t === "number") return "shs_t_number";
            if (t === "boolean") return "shs_t_bool";
            if (t === "object") return "shs_t_obj";
            if (t === "function") return "shs_t_func";
            return "";
        }

        // ===== 值 → 可读字符串 =====
        function shs_valStr(val) {
            if (val === null) return "null";
            if (val === undefined) return "undefined";
            if (typeof val === "function") return "ƒ " + (val.name || "anonymous") + "()";
            if (typeof val === "string") return '"' + val + '"';
            if (Array.isArray(val)) return "[" + val.map(shs_valStr).join(", ") + "]";
            if (typeof val === "object") return "{" + Object.keys(val).map(function(k){ return k + ": " + shs_valStr(val[k]); }).join(", ") + "}";
            return String(val);
        }

        // ===== 渲染对象 =====
        function shs_render(highlightKey) {
            var stage = document.getElementById("shs_stage");
            stage.innerHTML = "";
            var keys = Object.keys(shs_obj);
            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                var v = shs_obj[k];
                var prop = document.createElement("div");
                prop.className = "shs_prop";
                prop.style.borderLeftColor = shs_prop._last ? "#ddd" : "";

                var keyEl = document.createElement("div");
                keyEl.className = "shs_key";
                keyEl.textContent = k;

                var colon = document.createElement("div");
                colon.className = "shs_colon";
                colon.textContent = ":";

                var valEl = document.createElement("div");
                valEl.className = "shs_val " + shs_typeClass(v);
                valEl.textContent = shs_valStr(v);

                prop.appendChild(keyEl);
                prop.appendChild(colon);
                prop.appendChild(valEl);

                if (highlightKey && k === highlightKey) {
                    prop.classList.add("shs_highlight");
                }
                stage.appendChild(prop);
            }
            if (keys.length === 0) {
                stage.innerHTML = '<span style="color:#aaa;padding:20px;">（空对象 — 试试加属性）</span>';
            }
        }

        // ===== 代码显示 =====
        function shs_showCode(codeHTML, resultHTML) {
            var box = document.getElementById("shs_code");
            box.innerHTML = codeHTML +
                '<div class="shs_result">⬇ 返回值：<span id="shs_ret"></span></div>';
            document.getElementById("shs_ret").innerHTML = resultHTML;
        }

        // ===== 日志 =====
        function shs_log(msg) {
            var box = document.getElementById("shs_log");
            var item = document.createElement("div");
            item.className = "shs_log-item";
            var t = new Date().toLocaleTimeString();
            item.innerHTML = '<span class="shs_tag">' + t + '</span>' + msg;
            box.insertBefore(item, box.firstChild);
        }

        // ===== 主调度 =====
        function shs_do(name) {
            switch (name) {

            case "reset":
                shs_obj = JSON.parse(JSON.stringify(shs_INITIAL));
                shs_showCode(
                    '<span class="shs_comment">// 重置对象</span>\n' +
                    '<span class="shs_kw">const</span> person = { ... };',
                    '<span style="color:#dcdcaa">已恢复</span>'
                );
                shs_log('<b>重置</b> → 对象恢复初始状态');
                shs_render();
                break;

            // —— 读取 ——
            case "dot":
                var v1 = shs_obj.name;
                shs_showCode(
                    '<span class="shs_kw">const</span> n = person.<span class="shs_func">name</span>;',
                    '<span class="shs_str">"' + v1 + '"</span>'
                );
                shs_log('<b>person.name</b> → "' + v1 + '"');
                shs_render("name");
                break;

            case "bracket":
                var v2 = shs_obj["age"];
                shs_showCode(
                    '<span class="shs_kw">const</span> a = person[<span class="shs_str">"age"</span>];',
                    '<span class="shs_num">' + v2 + '</span>'
                );
                shs_log('<b>person["age"]</b> → ' + v2);
                shs_render("age");
                break;

            case "hasName":
                var r1 = "name" in shs_obj;
                shs_showCode(
                    '<span class="shs_str">"name"</span> <span class="shs_kw">in</span> person',
                    r1 ? '<span style="color:#38ef7d">true</span>' : '<span style="color:#ff6b6b">false</span>'
                );
                shs_log('<b>"name" in person</b> → ' + r1);
                shs_render("name");
                break;

            case "hasPhone":
                var r2 = Object.prototype.hasOwnProperty.call(shs_obj, "phone");
                shs_showCode(
                    'person.<span class="shs_func">hasOwnProperty</span>(<span class="shs_str">"phone"</span>)',
                    r2 ? '<span style="color:#38ef7d">true</span>' : '<span style="color:#ff6b6b">false</span>'
                );
                shs_log('<b>hasOwnProperty("phone")</b> → ' + r2 + '（注意 null ≠ undefined）');
                shs_render("phone");
                break;

            // —— 增改删 ——
            case "addEmail":
                shs_obj.email = "xiaoming@mail.com";
                shs_showCode(
                    'person.email = <span class="shs_str">"xiaoming@mail.com"</span>;',
                    '<span style="color:#dcdcaa">已添加</span>'
                );
                shs_log('<b>加属性</b> email = "xiaoming@mail.com"');
                shs_render("email");
                break;

            case "addScore":
                shs_obj.score = 95;
                shs_showCode(
                    'person.score = <span class="shs_num">95</span>;',
                    '<span style="color:#dcdcaa">已添加</span>'
                );
                shs_log('<b>加属性</b> score = 95');
                shs_render("score");
                break;

            case "updAge":
                shs_obj.age = 19;
                shs_showCode(
                    'person.age = <span class="shs_num">19</span>;',
                    '<span style="color:#dcdcaa">已修改</span>'
                );
                shs_log('<b>改属性</b> age: ' + shs_INITIAL.age + ' → 19');
                shs_render("age");
                break;

            case "delPhone":
                if (!("phone" in shs_obj)) {
                    shs_log('phone 属性已不存在，删什么删 😄');
                    return;
                }
                var removed = delete shs_obj.phone;
                shs_showCode(
                    '<span class="shs_kw">delete</span> person.phone;',
                    removed ? '<span style="color:#38ef7d">true</span>' : '<span style="color:#ff6b6b">false</span>'
                );
                shs_log('<b>delete person.phone</b> → 返回 ' + removed + '，phone 已移除');
                shs_render();
                break;

            // —— Object 方法 ——
            case "keys":
                var k = Object.keys(shs_obj);
                shs_showCode(
                    'Object.<span class="shs_func">keys</span>(person)',
                    '<span class="shs_num">[' + k.map(function(x){return '"'+x+'"';}).join(", ") + ']</span>'
                );
                shs_log('<b>Object.keys</b> → ' + k.length + ' 个键：' + k.join(", "));
                shs_render();
                break;

            case "values":
                var v = Object.values(shs_obj);
                shs_showCode(
                    'Object.<span class="shs_func">values</span>(person)',
                    '<span class="shs_num">[' + v.map(shs_valStr).join(", ") + ']</span>'
                );
                shs_log('<b>Object.values</b> → ' + v.map(shs_valStr).join(", "));
                shs_render();
                break;

            case "entries":
                var e = Object.entries(shs_obj);
                shs_showCode(
                    'Object.<span class="shs_func">entries</span>(person)',
                    '<span class="shs_num">[' + e.map(function(x){return '["'+x[0]+'", '+shs_valStr(x[1])+']';}).join(", ") + ']</span>'
                );
                shs_log('<b>Object.entries</b> → ' + e.length + ' 个 [key, value] 对');
                shs_render();
                break;

            case "assign":
                var extra = { grade: "高二", classNo: 3 };
                var merged = Object.assign({}, shs_obj, extra);
                shs_showCode(
                    '<span class="shs_kw">const</span> merged = Object.<span class="shs_func">assign</span>({}, person, { grade: <span class="shs_str">"高二"</span>, classNo: <span class="shs_num">3</span> });',
                    '<span style="color:#dcdcaa">新对象，含原所有属性 + grade + classNo</span>'
                );
                shs_log('<b>Object.assign</b> → 合并出一个新对象（原 person 不变），新增 grade、classNo');
                shs_render();
                break;

            case "spread":
                var copy = Object.assign({}, shs_obj); // 等价浅拷贝
                shs_showCode(
                    '<span class="shs_kw">const</span> copy = { ...person };',
                    '<span style="color:#dcdcaa">copy 和 person 内容相同，但是两个独立对象</span>'
                );
                shs_log('<b>{...person}</b> → 浅拷贝一份，改 copy 的基本类型不会影响 person');
                shs_render();
                break;

            case "stringify":
                var s = JSON.stringify(shs_obj, null, 2);
                shs_showCode(
                    'JSON.<span class="shs_func">stringify</span>(person, <span class="shs_num">null</span>, <span class="shs_num">2</span>)',
                    '<span class="shs_str">"（一个很长的 JSON 字符串）"</span>'
                );
                shs_log('<b>JSON.stringify</b> → 得到 JSON 字符串（可以 console.log 查看完整内容）');
                console.log("JSON.stringify 结果：\n" + s);
                break;

            // —— 方法 & this ——
            case "addMethod":
                shs_obj.sayHi = function() {
                    return "Hi, 我是 " + this.name + "，今年 " + this.age + " 岁";
                };
                shs_showCode(
                    'person.sayHi = <span class="shs_kw">function</span>() {\n' +
                    '  <span class="shs_kw">return</span> <span class="shs_str">"Hi, 我是 "</span> + <span class="shs_kw">this</span>.name + ...;\n' +
                    '};',
                    '<span style="color:#dcdcaa">已添加方法</span>'
                );
                shs_log('<b>加方法 sayHi</b> → this 在函数里指向 person 本身');
                shs_render("sayHi");
                break;

            case "callMethod":
                if (typeof shs_obj.sayHi !== "function") {
                    shs_log('⚠ 还没有 sayHi 方法，请先点"加 sayHi()"');
                    return;
                }
                var msg = shs_obj.sayHi();
                shs_showCode(
                    '<span class="shs_kw">const</span> m = person.<span class="shs_func">sayHi</span>();',
                    '<span class="shs_str">"' + msg + '"</span>'
                );
                shs_log('<b>调用 sayHi()</b> → 返回 "' + msg + '"');
                alert(msg);
                break;
            }
        }

        // ===== 初始 =====
        shs_render();
        shs_log('初始对象 person 有 ' + Object.keys(shs_obj).length + ' 个键：' + Object.keys(shs_obj).join(", "));
    </script>
</body>
</html>
