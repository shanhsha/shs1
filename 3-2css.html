<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>307 单海晟</title>
    <style>
        p{
            color: blue;
            font-size: 50px; 
        }

        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: brown;
        }
       .n1{
        color: rgb(68, 236, 236);
       }
       .n2{
        color: rgb(168, 21, 56);
       }
       .n3{
        color: rgb(40, 159, 77);
       }
       h2{
        background-color: black;
        color: white;
       }
       #box2{
        width:300px;
        height:300px;
        background-color: rgb(44, 10, 78);
       }


    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span style="color:white">选择器</span></p>
        <p><span class="n1">单</span><span class="n2">海</span><span class="n3">晟</span></p>
        <p>CSS属性</p>
    </div>
    <div id="box2"></div>
</body>
</html>
